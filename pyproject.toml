[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-core"
version = "0.8.2"
description = "Data contract core library — schemas, contracts, compilers, runtime validation."
requires-python = ">=3.13"
dependencies = [
    "pydantic~=2.13",
    "pandera>=0.32.1,<0.34.0",
    "pandas>=2.0.0",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
# pre-commit is here because README's Setup step runs `pre-commit install` — the step that
# installs the gitleaks hook, i.e. the one local security control. Without it in dev, a new
# engineer following Setup verbatim gets `command not found` on exactly that line.
#
# hatchling is the build backend, normally supplied by pip's build isolation. It is here
# because tests/test_distribution.py installs with --no-build-isolation, so the backend has
# to already exist in the environment — that is what keeps the install test off PyPI.
dev = ["pytest>=9.1.1", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8",
       "hatchling", "build", "pandas-stubs", "types-jsonschema", "types-PyYAML"]

[project.scripts]
contract = "contract_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_core"]
# hatchling's default packages-based selection already walks non-.py files under src/contract_core
# (that's why the vendor JSON above didn't previously need this), which would otherwise collide
# with the templates force-include below ("second file being added to the wheel archive at the
# same path"). Exclude it from the default walk so force-include is the templates dir's one source.
exclude = ["src/contract_core/scaffold/templates"]

[tool.hatch.build.targets.wheel.force-include]
"src/contract_core/vendor/odcs-json-schema-v3.1.0-20260505.json" = "contract_core/vendor/odcs-json-schema-v3.1.0-20260505.json"
"src/contract_core/scaffold/templates" = "contract_core/scaffold/templates"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Fail loud, not silent: --strict-config errors on a mistyped/unknown config key, --strict-markers
# on an unregistered marker. Both are the class of error that otherwise erodes the "tests ran and
# were configured as intended" guarantee by passing green. (design Item 2)
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
# The authoring-skill templates under skills/ are illustrative teaching snippets — they carry
# intentional placeholder imports (`from my_pkg.boundaries import ...`) and `...` bodies, so they
# cannot and should not satisfy the first-party lint. They are not importable source.
# .github/fixtures/gate-consumer/ is the same case: a committed `contract init` output that
# gate-selftest.yml runs the reusable gate against. It is a foreign consumer project (placeholder
# adapter + on-purpose-red drift test), linted by the consumer's own ruff, not data-contract's.
extend-exclude = ["skills/", ".github/fixtures/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.bandit]
# Bandit (Item 4 Part A SAST) config home — the stack keeps tool config here, like ruff/mypy above.
# CI already scopes the scan to first-party source with `bandit -r src`; tests legitimately use
# `assert` and subprocess in ways that are not production risks, so they are not scanned. Suppress an
# individual finding in-code with `# nosec <TEST_ID>` (reviewed in the diff) — see SECURITY.md for
# why a suppression here is a silent, un-expiring hole. Add long-lived, team-agreed skips below.
exclude_dirs = ["tests"]
