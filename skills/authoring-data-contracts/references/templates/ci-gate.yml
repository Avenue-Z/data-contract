# TEMPLATE — wiring the contract gate into CI. Save as .github/workflows/contract.yml in YOUR repo.
# Full detail: consuming-repo-setup.md §7. This runs `contract lint` + `contract reconcile` per PR.
#
# TWO things must line up (all >= v0.5.0, the gate's first release):
#   1. Your pyproject.toml pins  contract-core @ git+https://github.com/Avenue-Z/data-contract.git@vX.Y.Z
#      — keep the `.git` suffix; data-contract is public so no read token is required.
#   2. The reusable workflow `@tag` below is the SAME tag (a mismatch is silent CLI breakage).
#
# Also register the raw_drift marker in pyproject.toml so pytest --strict-markers won't reject it:
#   [tool.pytest.ini_options]
#   markers = ["raw_drift: a drift test guarding a raw boundary (read by `contract reconcile`)"]

name: contract
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    uses: Avenue-Z/data-contract/.github/workflows/contract-gate.yml@vX.Y.Z   # SAME tag as your pin
    with:
      contract: contract.yaml
      package: my_pkg            # importable — reconcile imports it to find registered boundaries
      schemas: |                 # one dir per line; required
        schemas
      tests: |                   # one path per line; required
        tests
