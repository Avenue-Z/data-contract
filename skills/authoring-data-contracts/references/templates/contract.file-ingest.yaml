# TEMPLATE — contract.yaml for a FILE-INGEST automation (the common case).
# A file/CSV source is NOT mediated, so there is a single normalized `input` boundary — no `raw`.
# Save at the repo root as `contract.yaml`.
#
# Top level is `system:` + `version:` (NOT `name:`). Groups are `inputs:` / `outputs:` (plural).
# Every boundary references a schema by `platform.name@major` — never inline a shape.

system: sentiment-digest        # NOT `name:` — this is the automation's name
version: 1.0.0
# mode starts at `observe` (validate + log, never fail) — the on-ramp. Confirm the shape on
# live data by reading the event log, then promote each boundary to `enforce` (SKILL.md Phase C).
inputs:
  - name: sentiment_scores
    schema: sentiment.scores@1  # resolves to schemas/sentiment/scores/<semver>.yaml
    source: {kind: file, format: csv}
    mode: observe               # observe | warn | enforce — promote to enforce once confirmed
outputs:
  - name: digest
    schema: sentiment.digest@1
    sink: {kind: file, format: json}
    mode: observe
